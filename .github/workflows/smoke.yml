name: Smoke

# Boots a real Lima VM (qemu/KVM) on a Linux runner, provisions every profile,
# and runs the full in-VM smoke suite (tests/run-all.sh). We use ubuntu-latest
# because GitHub's Apple-silicon macOS runners lack nested virtualization (the
# vz backend dies instantly at "Starting VZ"); ubuntu-latest exposes /dev/kvm,
# so we boot the VM with qemu/KVM instead. The vz path is exercised by
# developers running on real Macs. Heavy (~30-60 min), so it runs on pushes to
# main and nightly — not on PRs. `workflow_dispatch` is for manual runs while
# iterating.
#
# No untrusted inputs are interpolated into `run:` steps; all values are
# workflow-literal or come from checked-in files.
on:
  workflow_dispatch:
  push:
    branches: [main, worktree-shimmying-gliding-melody] # TEMP: branch added for pre-merge verification; remove before merge
  schedule:
    - cron: "17 3 * * *" # nightly 03:17 UTC

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  LIMA_VERSION: "2.1.2"
  LIMA_SHA256: "648ed5f599012a0864bd0c4809063b18116bca57f2593d30547dfedbef3c2ce0"

jobs:
  smoke-linux-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install qemu + Lima ${{ env.LIMA_VERSION }}
        run: |
          sudo apt-get update || (sleep 15 && sudo apt-get update)
          sudo apt-get install -y qemu-system-x86 qemu-utils
          curl -fsSL -o /tmp/lima.tar.gz \
            "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          echo "${LIMA_SHA256}  /tmp/lima.tar.gz" | sha256sum --check
          sudo tar -C /usr/local --no-same-owner -xzf /tmp/lima.tar.gz
          limactl --version
          python3 --version

      - name: Throwaway SSH identity (agent forwarding + git signing)
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -C "ci@runmachine.dev" -f ~/.ssh/ci_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/ci_ed25519
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            echo "GIT_NAME=machine CI"
            echo "GIT_EMAIL=ci@runmachine.dev"
            echo "GIT_SIGNING_KEY=$(cat ~/.ssh/ci_ed25519.pub)"
            echo "PROJECTS_FILE=$GITHUB_WORKSPACE/ci-projects.toml"
          } >> "$GITHUB_ENV"

      - name: Write CI projects.toml (all profiles, no repos)
        run: |
          cat > ci-projects.toml <<'EOF'
          [ci]
          profiles = ["cypress", "playwright", "supabase-fly", "modern"]
          repos = []
          EOF

      - name: Use qemu instead of vz (CI-only template tweak)
        run: |
          sed -i 's/^vmType: vz$/vmType: qemu/' templates/base.yaml
          grep -n 'vmType' templates/base.yaml
          grep -q 'vmType: qemu' templates/base.yaml

      - name: machine up
        run: ./bin/machine up ci

      - name: Smoke suite
        run: bash tests/run-all.sh ci

      - name: Provision log on failure
        if: failure()
        run: limactl shell ci -- sudo tail -200 /var/log/cloud-init-output.log || true

      - name: Destroy VM
        if: always()
        run: ./bin/machine destroy -y ci || true
