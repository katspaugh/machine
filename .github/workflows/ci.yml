name: CI

# Triggers: push to main and any PR. No untrusted inputs are interpolated into
# `run:` steps below — all values are either workflow-literal or come from
# checked-in files in the repo.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: bash tests/lint.sh

      - name: Unit tests (host-side)
        run: bash tests/unit.sh

      - name: Validate Lima templates (YAML syntax)
        run: |
          pip install pyyaml
          python3 - <<'EOF'
          import sys, yaml
          from pathlib import Path
          for f in sorted(Path("templates").glob("*.yaml")):
              yaml.safe_load(f.read_text())
              print(f"ok {f}")
          EOF
