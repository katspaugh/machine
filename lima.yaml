# Per-VM Lima template. `bin/machine up <p>` runs `limactl create --name=<p>`
# against this file, then pushes provision.toml + the chosen profiles and runs
# provision/run.py inside the VM. No host filesystem mounts; only the SSH agent
# and a fixed range of localhost ports are bridged.

vmType: vz

cpus: 4
memory: "8GiB"
disk: "30GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

# No host filesystem visible to the guest. Each project gets its own VM, so
# there's no cross-project leakage even via shared host paths.
mounts: []

ssh:
  forwardAgent: true
  loadDotSSHPubKeys: false

portForwards:
  - guestPortRange: [3000, 3010]
    hostIP: 127.0.0.1
  - guestPortRange: [4200, 4200]
    hostIP: 127.0.0.1
  - guestPortRange: [5173, 5180]
    hostIP: 127.0.0.1
  - guestPortRange: [8080, 8099]
    hostIP: 127.0.0.1

# No provision: block here. bin/machine pushes provision.toml,
# provision/run.py, profiles, and the files/ tree into /opt/dev-vm/ on every
# `up` (mkdir -p creates the dirs as needed), so wiring a baked-in step would
# just go stale.

hostResolver:
  enabled: true
