# Base provisioning config. Always applied; profiles in profiles/*.toml stack
# on top via projects.toml's `profiles = [...]` list.
#
# Schema:
#   [apt]               packages = ["..."]                           # apt-get install
#   [[apt_repo]]        name, key_url, deb, packages, when?, post_shell?
#   [[installer]]       name, url, env?, run_as_user?, verify?       # curl | bash
#   [[release]]         name, url, bin, install_to, verify?          # tarball
#   [corepack]          prepare = ["pnpm@latest", ...]
#   [npm_global]        packages = ["..."]                            # installed as $LIMA_USER
#   profile_d           = ["x.sh", ...]                               # files/profile.d/<x> -> /etc/profile.d/
#   [claude]            marketplace, plugins, default_permission_mode
#   [[shell]]           name, cmd, run_as_user?, when?                # escape hatch
#
# Step order is fixed (see provision/run.py STEPS).
# Variables available in cmds/templates: $LIMA_USER, $USER_HOME, {arch}, {codename}.

# --- Base apt set ----------------------------------------------------------
# `[[apt]]` is the array-of-tables form so profiles can append their own
# conditional blocks (e.g. arch-gated chromium-browser in profiles/cypress.toml).
[[apt]]
packages = [
  "build-essential", "ca-certificates", "curl", "gnupg", "jq", "xz-utils",
  "unzip", "git", "zsh", "ripgrep", "fd-find", "tmux", "less", "file", "python3",
  "direnv",
]

# --- Third-party apt repos -------------------------------------------------
[[apt_repo]]
name       = "docker"
key_url    = "https://download.docker.com/linux/ubuntu/gpg"
deb        = "https://download.docker.com/linux/ubuntu {codename} stable"
packages   = ["docker-ce", "docker-ce-cli", "containerd.io",
              "docker-buildx-plugin", "docker-compose-plugin"]
post_shell = "usermod -aG docker $LIMA_USER && systemctl enable --now docker"

[[apt_repo]]
name     = "github-cli"
key_url  = "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
deb      = "https://cli.github.com/packages stable main"
packages = ["gh"]

# Node from NodeSource (replaces mise — single Node per VM is fine).
[[apt_repo]]
name     = "nodesource"
key_url  = "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
deb      = "https://deb.nodesource.com/node_lts.x nodistro main"
packages = ["nodejs"]

# --- curl|bash installers --------------------------------------------------
[[installer]]
name        = "claude"
url         = "https://claude.ai/install.sh"
run_as_user = true
verify      = "command -v claude"

# --- corepack-managed package managers -------------------------------------
[corepack]
prepare = ["pnpm@latest", "yarn@stable"]

# --- npm globals (installed as $LIMA_USER) ---------------------------------
[npm_global]
packages = ["typescript", "typescript-language-server", "@openai/codex"]

# --- Login-shell snippets --------------------------------------------------
[profile_d]
files = ["node.sh", "direnv.sh", "local-bin.sh"]

# --- Claude Code marketplace + plugins -------------------------------------
[claude]
marketplace             = "anthropics/claude-plugins-official"
plugins                 = ["frontend-design", "superpowers", "github",
                           "typescript-lsp", "security-guidance",
                           "commit-commands", "chrome-devtools-mcp", "supabase"]
default_permission_mode = "auto"

# --- Escape hatch: things that don't fit a typed section --------------------
[[shell]]
name = "default-shell-zsh"
cmd  = "chsh -s /usr/bin/zsh $LIMA_USER || true"

[[shell]]
name = "install-gitconfig"
cmd  = """
install -m 0644 -o $LIMA_USER -g $LIMA_USER \
  /opt/dev-vm/files/git/gitconfig $USER_HOME/.gitconfig
install -d -m 0755 -o $LIMA_USER -g $LIMA_USER $USER_HOME/.config/git
install -m 0644 -o $LIMA_USER -g $LIMA_USER \
  /opt/dev-vm/files/git/allowed_signers $USER_HOME/.config/git/allowed_signers
"""

[[shell]]
name = "install-direnvrc"
cmd  = """
install -d -m 0755 -o $LIMA_USER -g $LIMA_USER $USER_HOME/.config/direnv
install -m 0644 -o $LIMA_USER -g $LIMA_USER \
  /opt/dev-vm/files/direnv/op_env.sh $USER_HOME/.config/direnv/direnvrc
"""

# Pre-seed SSH known_hosts so first-clone uses StrictHostKeyChecking=yes
# instead of TOFU. New entries the user picks up via `ssh-keyscan` get
# appended; we never overwrite existing entries.
[[shell]]
name = "install-known-hosts"
cmd  = """
install -d -m 0700 -o $LIMA_USER -g $LIMA_USER $USER_HOME/.ssh
if [ ! -f $USER_HOME/.ssh/known_hosts ]; then
  install -m 0644 -o $LIMA_USER -g $LIMA_USER \
    /opt/dev-vm/files/ssh/known_hosts $USER_HOME/.ssh/known_hosts
else
  # Append any pre-seeded entries not already present.
  awk 'NR==FNR{seen[$0]=1; next} !seen[$0]' \
    $USER_HOME/.ssh/known_hosts /opt/dev-vm/files/ssh/known_hosts \
    >> $USER_HOME/.ssh/known_hosts.tmp || true
  if [ -s $USER_HOME/.ssh/known_hosts.tmp ]; then
    cat $USER_HOME/.ssh/known_hosts.tmp >> $USER_HOME/.ssh/known_hosts
  fi
  rm -f $USER_HOME/.ssh/known_hosts.tmp
  chown $LIMA_USER:$LIMA_USER $USER_HOME/.ssh/known_hosts
fi
"""
