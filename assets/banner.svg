<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="machine — isolated Lima VMs per project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="vm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="960" height="360" fill="url(#bg)"/>
  <rect width="960" height="360" fill="url(#grid)" opacity="0.6"/>

  <!-- ambient glows behind VMs -->
  <ellipse cx="180" cy="200" rx="120" ry="70" fill="#22d3ee" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="480" cy="200" rx="120" ry="70" fill="#a78bfa" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="780" cy="200" rx="120" ry="70" fill="#f472b6" opacity="0.12" filter="url(#soft)"/>

  <!-- Title -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="68" fill="#e5e7eb" font-size="34" font-weight="700" letter-spacing="-0.5">
      <tspan fill="url(#glow)">~/</tspan>machine
    </text>
    <text x="48" y="94" fill="#94a3b8" font-size="14">
      one ready-to-work VM per project · docker · node · agents · signed git
    </text>
  </g>

  <!-- VM cards -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

    <!-- VM 1: blog -->
    <g transform="translate(72,140)">
      <rect width="220" height="170" rx="12" fill="url(#vm)" stroke="#334155"/>
      <rect x="0" y="0" width="220" height="28" rx="12" fill="#0b1220"/>
      <rect x="0" y="16" width="220" height="12" fill="#0b1220"/>
      <circle cx="14" cy="14" r="4" fill="#ef4444"/>
      <circle cx="28" cy="14" r="4" fill="#f59e0b"/>
      <circle cx="42" cy="14" r="4" fill="#22c55e"/>
      <text x="64" y="18" fill="#64748b" font-size="11">lima · blog</text>

      <text x="16" y="56" fill="#22d3ee" font-size="13">$ machine up blog</text>
      <text x="16" y="78" fill="#94a3b8" font-size="12">› cloning git@github.com...</text>
      <text x="16" y="96" fill="#94a3b8" font-size="12">› node · docker · gh</text>
      <text x="16" y="114" fill="#94a3b8" font-size="12">› claude code ready</text>
      <text x="16" y="148" fill="#34d399" font-size="13">●<tspan fill="#e5e7eb" dx="6">running :3000</tspan></text>
    </g>

    <!-- VM 2: wallet -->
    <g transform="translate(370,140)">
      <rect width="220" height="170" rx="12" fill="url(#vm)" stroke="#334155"/>
      <rect x="0" y="0" width="220" height="28" rx="12" fill="#0b1220"/>
      <rect x="0" y="16" width="220" height="12" fill="#0b1220"/>
      <circle cx="14" cy="14" r="4" fill="#ef4444"/>
      <circle cx="28" cy="14" r="4" fill="#f59e0b"/>
      <circle cx="42" cy="14" r="4" fill="#22c55e"/>
      <text x="64" y="18" fill="#64748b" font-size="11">lima · wallet</text>

      <text x="16" y="56" fill="#a78bfa" font-size="13">$ machine ssh wallet</text>
      <text x="16" y="78" fill="#94a3b8" font-size="12">› safe-wallet-dev-env</text>
      <text x="16" y="96" fill="#94a3b8" font-size="12">› safe-wallet-monorepo</text>
      <text x="16" y="114" fill="#94a3b8" font-size="12">› safe-client-gateway</text>
      <text x="16" y="148" fill="#34d399" font-size="13">●<tspan fill="#e5e7eb" dx="6">cypress profile</tspan></text>
    </g>

    <!-- VM 3: playground -->
    <g transform="translate(668,140)">
      <rect width="220" height="170" rx="12" fill="url(#vm)" stroke="#334155"/>
      <rect x="0" y="0" width="220" height="28" rx="12" fill="#0b1220"/>
      <rect x="0" y="16" width="220" height="12" fill="#0b1220"/>
      <circle cx="14" cy="14" r="4" fill="#ef4444"/>
      <circle cx="28" cy="14" r="4" fill="#f59e0b"/>
      <circle cx="42" cy="14" r="4" fill="#22c55e"/>
      <text x="64" y="18" fill="#64748b" font-size="11">lima · playground</text>

      <text x="16" y="56" fill="#f472b6" font-size="13">$ machine up playground</text>
      <text x="16" y="78" fill="#94a3b8" font-size="12">› reproducible from TOML</text>
      <text x="16" y="96" fill="#94a3b8" font-size="12">› supabase · flyctl</text>
      <text x="16" y="114" fill="#94a3b8" font-size="12">› 1password env</text>
      <text x="16" y="148" fill="#34d399" font-size="13">●<tspan fill="#e5e7eb" dx="6">isolated</tspan></text>
    </g>
  </g>

  <!-- isolation barriers (dashed lines between VMs) -->
  <g stroke="#334155" stroke-dasharray="3 5" stroke-width="1">
    <line x1="328" y1="150" x2="328" y2="300"/>
    <line x1="626" y1="150" x2="626" y2="300"/>
  </g>

  <!-- corner brand mark -->
  <g transform="translate(880,40)" fill="none" stroke="url(#glow)" stroke-width="2">
    <rect x="0" y="0" width="14" height="14" rx="2"/>
    <rect x="18" y="0" width="14" height="14" rx="2"/>
    <rect x="0" y="18" width="14" height="14" rx="2"/>
    <rect x="18" y="18" width="14" height="14" rx="2" stroke="#f472b6"/>
  </g>
</svg>
