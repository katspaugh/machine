# Supabase CLI + fly.io CLI. Apply to projects that deploy to Supabase / Fly.

[[release]]
name       = "supabase"
url        = "https://github.com/supabase/cli/releases/latest/download/supabase_linux_{arch}.tar.gz"
bin        = "supabase"
install_to = "/usr/local/bin/supabase"
verify     = "/usr/local/bin/supabase --version"

[[installer]]
name   = "flyctl"
url    = "https://fly.io/install.sh"
env    = { FLYCTL_INSTALL = "/usr/local" }
verify = "/usr/local/bin/flyctl version"
