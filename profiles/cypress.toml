# Cypress + a Chromium-family browser. Apply to any project that runs
# browser-driven tests in the VM.

[[apt]]
packages = [
  "libgtk2.0-0", "libgtk-3-0", "libgbm-dev", "libnotify-dev", "libnss3",
  "libxss1", "libasound2t64", "libxtst6", "xauth", "xvfb", "fonts-liberation",
]

# Chrome on amd64; chromium-browser fallback on arm64 (Chrome has no arm64 .deb).
[[apt_repo]]
when     = { arch = "amd64" }
name     = "google-chrome"
key_url  = "https://dl.google.com/linux/linux_signing_key.pub"
deb      = "http://dl.google.com/linux/chrome/deb/ stable main"
packages = ["google-chrome-stable"]

[[apt]]
when     = { arch = "arm64" }
packages = ["chromium-browser"]
